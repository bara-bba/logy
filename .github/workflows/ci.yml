name: CI

# Build + unit tests on every push and pull request. The GitRunner tests use the runner's git.
on:
  push:
  pull_request:

jobs:
  build:
    # WPF requires a Windows runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build logy.sln -c Release

      - name: Unit tests
        run: dotnet test logy.sln -c Release --no-build
